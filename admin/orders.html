<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders — Admin</title>
<link rel="stylesheet" href="css/admin.css">
<style>
  .order-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 500;
    background: var(--bg2); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
  }
  .filter-chip.active { background: var(--brand); color: #000; border-color: var(--brand); font-weight: 600; }
  .order-preview-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: #000; margin-bottom: 12px; }
  .spec-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .spec-row .label { color: var(--muted); }
  .spec-row .val { font-weight: 600; text-align: right; }
</style>
</head>
<body class="admin-layout">

<!-- ══ SIDEBAR ══════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img id="brand-logo" src="" alt="Logo" style="display:none;width:36px;height:36px;border-radius:8px;object-fit:cover;">
    <div id="brand-icon" class="brand-icon">🪧</div>
    <div class="brand-text"><div class="name" id="brand-name">Admin</div><div class="tag" id="brand-tag"></div></div>
  </div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="orders.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Orders</a>
    <a href="templates.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Templates</a>
    <a href="design-tools.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Design Tools</a>
    <a href="settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
  </nav>
  <div class="sidebar-footer"><button id="logoutBtn" class="btn btn-ghost" style="width:100%;justify-content:center">← Logout</button></div>
</aside>

<!-- ══ MAIN CONTENT ═════════════════════════════════════════ -->
<div class="main-content">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="topbar-title">📦 Customer Orders & Inquiries</span>
    </div>
    <div class="topbar-right">
      <div class="user-pill"><div class="user-avatar" id="userInitials">?</div><span id="userName">…</span></div>
    </div>
  </header>

  <div class="page-body">
    <div class="page-header">
      <div>
        <h2>All Orders</h2>
        <p style="font-size:12px;color:var(--muted)">Manage WhatsApp orders, production status, and customer details.</p>
      </div>
    </div>

    <!-- Status Filters -->
    <div class="order-filter-bar" id="filterBar">
      <button class="filter-chip active" data-filter="all">All Orders</button>
      <button class="filter-chip" data-filter="new">New Inquiries</button>
      <button class="filter-chip" data-filter="approved">Approved</button>
      <button class="filter-chip" data-filter="in_production">In Production</button>
      <button class="filter-chip" data-filter="dispatched">Dispatched</button>
    </div>

    <!-- Orders Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Order Ref</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Plate Title</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted)">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ ORDER DETAILS MODAL ══════════════════════════════════ -->
<div class="modal-overlay hidden" id="orderDetailModal">
  <div class="modal-box modal-lg">
    <div class="modal-header">
      <h3 id="modalOrderRef">Order Details</h3>
      <button class="btn btn-ghost btn-icon" id="closeDetailModal">✕</button>
    </div>
    <div class="modal-body" id="modalOrderDetailBody"></div>
    <div class="modal-footer" id="modalOrderDetailFooter"></div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { requireAuth, adminSignOut } from './js/auth.js';
import { getOrders, updateItem } from './js/db.js';
import { loadBranding, setActiveNav, toast, fmtDate } from './js/utils.js';

let ordersCache = [];
let currentFilter = 'all';

requireAuth(async (user, adminData) => {
  document.getElementById('userName').textContent    = adminData.name || user.email;
  document.getElementById('userInitials').textContent = (adminData.name||'A').charAt(0).toUpperCase();
  await loadBranding();
  setActiveNav();
  await loadOrdersList();
});

// Filter Bar
document.querySelectorAll('#filterBar .filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#filterBar .filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderOrdersTable();
  });
});

async function loadOrdersList() {
  ordersCache = await getOrders();
  renderOrdersTable();
}

function renderOrdersTable() {
  const tbody = document.getElementById('ordersTableBody');
  let list = ordersCache;

  if (currentFilter !== 'all') {
    list = list.filter(o => (o.status || 'new') === currentFilter);
  }

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><div class="icon">📭</div><p>No orders found matching this filter.</p></td></tr>';
    return;
  }

  const statusBadge = (s = 'new') => {
    const map = { new:'badge-gold', approved:'badge-blue', in_production:'badge-info', dispatched:'badge-green', cancelled:'badge-red' };
    return `<span class="badge ${map[s]||'badge-muted'}">${s.replace('_',' ')}</span>`;
  };

  tbody.innerHTML = list.map(o => `
    <tr>
      <td><strong style="color:var(--brand);font-size:12.5px">#${o.orderId || o.id.slice(0,6).toUpperCase()}</strong></td>
      <td><strong>${o.customerName || 'Valued Customer'}</strong></td>
      <td>${o.phone ? `<a href="tel:${o.phone}" style="color:var(--text)">${o.phone}</a>` : '—'}</td>
      <td>${o.line1 || o.title || 'Custom Plate'}</td>
      <td>${statusBadge(o.status)}</td>
      <td style="font-weight:700;color:var(--brand)">₹${o.totalAmount || o.price || '—'}</td>
      <td style="font-size:12px;color:var(--muted)">${fmtDate(o.createdAt)}</td>
      <td class="td-actions">
        <button class="btn btn-primary btn-sm" onclick="viewOrder('${o.id}')">View Details</button>
        ${o.phone ? `<a href="https://wa.me/${o.phone.replace(/\\D/g,'')}?text=Hi%20${encodeURIComponent(o.customerName||'')},%20regarding%20your%20Name%20Plate%20Order%20#${o.orderId||''}" target="_blank" class="btn btn-success btn-sm">WhatsApp</a>` : ''}
      </td>
    </tr>
  `).join('');
}

// ── VIEW ORDER DETAILS MODAL ──────────────────────────────────
const modal = document.getElementById('orderDetailModal');
document.getElementById('closeDetailModal').addEventListener('click', () => modal.classList.add('hidden'));

window.viewOrder = (id) => {
  const o = ordersCache.find(x => x.id === id);
  if (!o) return;

  document.getElementById('modalOrderRef').textContent = `Order #${o.orderId || o.id.slice(0,6).toUpperCase()}`;
  const body = document.getElementById('modalOrderDetailBody');
  const footer = document.getElementById('modalOrderDetailFooter');

  body.innerHTML = `
    ${o.snapshotUrl ? `<img src="${o.snapshotUrl}" class="order-preview-img" alt="Custom Plate Snapshot">` : ''}

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px">
      <div class="card card-sm">
        <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--brand)">Customer Information</h4>
        <div class="spec-row"><span class="label">Name</span><span class="val">${o.customerName || '—'}</span></div>
        <div class="spec-row"><span class="label">Phone</span><span class="val">${o.phone || '—'}</span></div>
        <div class="spec-row"><span class="label">Address</span><span class="val" style="font-size:12px">${o.address || '—'}</span></div>
      </div>

      <div class="card card-sm">
        <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--brand)">Design Specifications</h4>
        <div class="spec-row"><span class="label">Primary Text</span><span class="val">${o.line1 || '—'}</span></div>
        <div class="spec-row"><span class="label">Subtitle</span><span class="val">${o.line2 || '—'}</span></div>
        <div class="spec-row"><span class="label">Tagline</span><span class="val">${o.line3 || '—'}</span></div>
        <div class="spec-row"><span class="label">Material</span><span class="val">${o.material || '—'}</span></div>
        <div class="spec-row"><span class="label">Dimensions</span><span class="val">${o.dimensions || o.size || '—'}</span></div>
        <div class="spec-row"><span class="label">LED Effect</span><span class="val">${o.ledEffect || 'None'}</span></div>
      </div>
    </div>

    <div class="card card-sm">
      <div class="spec-row" style="border:none; font-size:15px"><span class="label" style="font-weight:700">Total Quoted Amount</span><span class="val" style="color:var(--brand); font-size:18px">₹${o.totalAmount || o.price || 0}</span></div>
      ${o.notes ? `<div style="margin-top:8px; font-size:12px; color:var(--muted)"><strong>Artisan Notes:</strong> ${o.notes}</div>` : ''}
    </div>

    <div class="form-group" style="margin-top:16px">
      <label class="form-label">Update Order Status</label>
      <select id="updateStatusSelect" class="form-select">
        <option value="new" ${o.status==='new'?'selected':''}>New Inquiry</option>
        <option value="approved" ${o.status==='approved'?'selected':''}>Approved & Confirmed</option>
        <option value="in_production" ${o.status==='in_production'?'selected':''}>In Workshop Production</option>
        <option value="dispatched" ${o.status==='dispatched'?'selected':''}>Dispatched / Shipped</option>
        <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
      </select>
    </div>
  `;

  footer.innerHTML = `
    <button class="btn btn-ghost" onclick="document.getElementById('orderDetailModal').classList.add('hidden')">Close</button>
    ${o.phone ? `<a href="https://wa.me/${o.phone.replace(/\\D/g,'')}?text=Hello%20${encodeURIComponent(o.customerName||'')},%20we%20have%20an%20update%20on%20your%20Name%20Plate%20Order%20#${o.orderId||''}" target="_blank" class="btn btn-success">Chat on WhatsApp</a>` : ''}
    <button class="btn btn-primary" onclick="saveStatusUpdate('${o.id}')">Save Status</button>
  `;

  modal.classList.remove('hidden');
};

window.saveStatusUpdate = async (id) => {
  const newStatus = document.getElementById('updateStatusSelect').value;
  try {
    await updateItem('orders', id, { status: newStatus });
    toast('Order status updated!', 'success');
    modal.classList.add('hidden');
    await loadOrdersList();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
};

// Logout
document.getElementById('logoutBtn').addEventListener('click', async () => { if (confirm('Logout?')) await adminSignOut(); });
</script>
</body>
</html>
