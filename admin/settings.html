<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings — Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">

<!-- ══ SIDEBAR (shared partial) ════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img id="brand-logo" src="" alt="Logo" style="display:none;width:36px;height:36px;border-radius:8px;object-fit:cover;">
    <div id="brand-icon" class="brand-icon">🪧</div>
    <div class="brand-text"><div class="name" id="brand-name">Admin</div><div class="tag" id="brand-tag"></div></div>
  </div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="orders.html"    class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Orders</a>
    <a href="templates.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Templates</a>
    <a href="design-tools.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Design Tools</a>
    <a href="settings.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
  </nav>
  <div class="sidebar-footer"><button id="logoutBtn" class="btn btn-ghost" style="width:100%;justify-content:center">← Logout</button></div>
</aside>

<!-- ══ MAIN ═════════════════════════════════════════════════ -->
<div class="main-content">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="topbar-title">⚙️ Settings</span>
    </div>
    <div class="topbar-right">
      <div class="user-pill"><div class="user-avatar" id="userInitials">?</div><span id="userName">…</span></div>
    </div>
  </header>

  <div class="page-body">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="store">🏪 Store Details</button>
      <button class="tab-btn" data-tab="admins">👥 Admin Accounts</button>
    </div>

    <!-- ── TAB: Store Details ── -->
    <div class="tab-panel active" id="tab-store">
      <div class="card" style="max-width:780px">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:18px">Store Information</h3>
        <form id="storeForm">
          <!-- Logo -->
          <div class="form-group" style="margin-bottom:20px">
            <label class="form-label">Business Logo</label>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
              <div style="position:relative">
                <img id="logoPreview" src="" alt="Logo" style="width:72px;height:72px;border-radius:12px;object-fit:cover;border:2px solid var(--border);display:none">
                <div id="logoPlaceholder" style="width:72px;height:72px;border-radius:12px;background:var(--bg3);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:28px">🪧</div>
              </div>
              <div>
                <label class="btn btn-ghost" style="cursor:pointer">
                  📁 Choose Logo (PNG / JPG / SVG)
                  <input type="file" id="logoFile" accept="image/*,.svg" style="display:none">
                </label>
                <p style="font-size:11px;color:var(--muted);margin-top:6px">Recommended: 256×256px square image</p>
                <button type="button" id="removeLogoBtn" class="btn btn-danger btn-sm" style="margin-top:6px;display:none">✕ Remove Logo</button>
              </div>
            </div>
          </div>

          <div class="form-grid" style="margin-bottom:14px">
            <div class="form-group">
              <label class="form-label">Business / Shop Name *</label>
              <input type="text" id="storeName" class="form-input" placeholder="e.g. ArtisansPlate Studio" required>
            </div>
            <div class="form-group">
              <label class="form-label">Tagline / Slogan</label>
              <input type="text" id="storeTagline" class="form-input" placeholder="e.g. Premium Custom Name Plates">
            </div>
            <div class="form-group">
              <label class="form-label">WhatsApp Business Number (with country code)</label>
              <input type="text" id="whatsapp" class="form-input" placeholder="919876543210">
            </div>
            <div class="form-group">
              <label class="form-label">Business Email</label>
              <input type="email" id="storeEmail" class="form-input" placeholder="info@yourbusiness.com">
            </div>
            <div class="form-group">
              <label class="form-label">Business Phone</label>
              <input type="text" id="storePhone" class="form-input" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
              <label class="form-label">City / Location</label>
              <input type="text" id="storeCity" class="form-input" placeholder="e.g. Mumbai, Maharashtra">
            </div>
          </div>

          <div class="form-group" style="margin-bottom:14px">
            <label class="form-label">Full Business Address</label>
            <textarea id="storeAddress" class="form-textarea" placeholder="Shop No, Street, Area, City, Pincode"></textarea>
          </div>

          <div class="form-grid" style="margin-bottom:20px">
            <div class="form-group">
              <label class="form-label">Currency Symbol</label>
              <input type="text" id="currency" class="form-input" placeholder="₹" maxlength="5">
            </div>
            <div class="form-group">
              <label class="form-label">GST Number (optional)</label>
              <input type="text" id="gst" class="form-input" placeholder="22ABCDE1234F1Z5">
            </div>
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button type="submit" class="btn btn-primary" id="saveStoreBtn">💾 Save Store Settings</button>
          </div>
        </form>
      </div>
    </div><!-- /tab-store -->

    <!-- ── TAB: Admin Accounts ── -->
    <div class="tab-panel" id="tab-admins">
      <div class="page-header">
        <h2 style="font-size:16px;font-weight:700">Admin Team Members</h2>
        <button class="btn btn-primary" id="addAdminBtn">＋ Add Admin</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Added On</th><th>Actions</th></tr></thead>
          <tbody id="adminsBody"><tr><td colspan="5" style="text-align:center;padding:32px;color:var(--muted)">Loading…</td></tr></tbody>
        </table>
      </div>
    </div><!-- /tab-admins -->
  </div>
</div><!-- /main -->

<!-- ══ ADD ADMIN MODAL ════════════════════════════════════ -->
<div class="modal-overlay hidden" id="adminModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="adminModalTitle">Add Admin</h3>
      <button class="btn btn-ghost btn-icon" id="closeAdminModal">✕</button>
    </div>
    <div class="modal-body">
      <form id="adminForm">
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="adminName" class="form-input" placeholder="Admin name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" id="adminEmail" class="form-input" placeholder="admin@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password * (min 8 chars)</label>
            <input type="password" id="adminPass" class="form-input" placeholder="••••••••" minlength="8">
            <span style="font-size:11px;color:var(--muted);margin-top:4px;display:block">Leave blank when editing to keep existing password</span>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select id="adminRole" class="form-select">
              <option value="admin">Admin (can manage everything)</option>
              <option value="staff">Staff (limited access)</option>
            </select>
          </div>
        </div>
        <div id="adminFormError" style="margin-top:12px;padding:10px;border-radius:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;font-size:13px;display:none;"></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelAdminModal">Cancel</button>
      <button class="btn btn-primary" id="saveAdminBtn">Save Admin</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { requireAuth, adminSignOut, createAdminUser } from './js/auth.js';
import { getStoreSettings, saveStoreSettings, getAdmins, saveAdmin, deleteAdmin, uploadFile } from './js/db.js';
import { loadBranding, toast, btnLoad, fmtDate } from './js/utils.js';

let currentUser = null;
let currentAdminData = null;
let logoStorageUrl = null;

requireAuth(async (user, adminData) => {
  currentUser = user;
  currentAdminData = adminData;
  document.getElementById('userName').textContent    = adminData.name || user.email;
  document.getElementById('userInitials').textContent = (adminData.name||'A').charAt(0).toUpperCase();
  await loadBranding();
  await loadStoreSettings();
  await loadAdmins();
});

// ── Tab switching ─────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Load Store Settings ───────────────────────────────────
async function loadStoreSettings() {
  const s = await getStoreSettings();
  document.getElementById('storeName').value    = s.name    || '';
  document.getElementById('storeTagline').value = s.tagline || '';
  document.getElementById('whatsapp').value     = s.whatsapp|| '';
  document.getElementById('storeEmail').value   = s.email   || '';
  document.getElementById('storePhone').value   = s.phone   || '';
  document.getElementById('storeCity').value    = s.city    || '';
  document.getElementById('storeAddress').value = s.address || '';
  document.getElementById('currency').value     = s.currency|| '₹';
  document.getElementById('gst').value          = s.gst     || '';
  if (s.logoUrl) {
    logoStorageUrl = s.logoUrl;
    document.getElementById('logoPreview').src          = s.logoUrl;
    document.getElementById('logoPreview').style.display = 'block';
    document.getElementById('logoPlaceholder').style.display = 'none';
    document.getElementById('removeLogoBtn').style.display   = 'inline-flex';
  }
}

// Logo file input
document.getElementById('logoFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('logoPreview').src          = ev.target.result;
    document.getElementById('logoPreview').style.display = 'block';
    document.getElementById('logoPlaceholder').style.display = 'none';
    document.getElementById('removeLogoBtn').style.display   = 'inline-flex';
  };
  reader.readAsDataURL(file);
});

document.getElementById('removeLogoBtn').addEventListener('click', () => {
  logoStorageUrl = null;
  document.getElementById('logoFile').value = '';
  document.getElementById('logoPreview').style.display    = 'none';
  document.getElementById('logoPlaceholder').style.display = 'flex';
  document.getElementById('removeLogoBtn').style.display   = 'none';
});

// ── Save Store Settings ───────────────────────────────────
document.getElementById('storeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('saveStoreBtn');
  btnLoad(btn, true);

  try {
    const logoFile = document.getElementById('logoFile').files[0];
    let logoUrl = logoStorageUrl || '';

    if (logoFile) {
      logoUrl = await uploadFile(`store/logo_${Date.now()}_${logoFile.name}`, logoFile);
    } else if (!document.getElementById('logoPreview').src || !document.getElementById('logoPreview').style.display || document.getElementById('logoPreview').style.display === 'none') {
      logoUrl = '';
    }

    const data = {
      name:     document.getElementById('storeName').value.trim(),
      tagline:  document.getElementById('storeTagline').value.trim(),
      whatsapp: document.getElementById('whatsapp').value.trim().replace(/\D/g,''),
      email:    document.getElementById('storeEmail').value.trim(),
      phone:    document.getElementById('storePhone').value.trim(),
      city:     document.getElementById('storeCity').value.trim(),
      address:  document.getElementById('storeAddress').value.trim(),
      currency: document.getElementById('currency').value.trim() || '₹',
      gst:      document.getElementById('gst').value.trim(),
      logoUrl
    };

    await saveStoreSettings(data);
    await loadBranding();  // Refresh sidebar branding
    toast('Store settings saved successfully!', 'success');
  } catch(err) {
    toast('Error saving: ' + err.message, 'error');
  } finally {
    btnLoad(btn, false);
  }
});

// ── Load Admins Table ─────────────────────────────────────
async function loadAdmins() {
  const admins = await getAdmins();
  const tbody  = document.getElementById('adminsBody');
  if (admins.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--muted)">No admins found</td></tr>';
    return;
  }
  tbody.innerHTML = admins.map(a => `
    <tr>
      <td><strong>${a.name||'—'}</strong></td>
      <td style="color:var(--muted)">${a.email||'—'}</td>
      <td><span class="badge ${a.role==='owner'?'badge-gold':'badge-blue'}">${a.role||'admin'}</span></td>
      <td style="font-size:12px;color:var(--muted)">${fmtDate(a.createdAt)}</td>
      <td class="td-actions">
        ${a.role!=='owner' ? `<button class="btn btn-danger btn-sm" onclick="removeAdmin('${a.id}')">Delete</button>` : '<span style="font-size:12px;color:var(--muted)">Owner</span>'}
      </td>
    </tr>`).join('');
}
window.removeAdmin = async (id) => {
  if (!confirm('Delete this admin? They will lose access.')) return;
  try { await deleteAdmin(id); toast('Admin removed','success'); await loadAdmins(); }
  catch(e) { toast('Error: '+e.message,'error'); }
};

// ── Add Admin Modal ───────────────────────────────────────
const adminModal = document.getElementById('adminModal');
document.getElementById('addAdminBtn').addEventListener('click', () => adminModal.classList.remove('hidden'));
document.getElementById('closeAdminModal').addEventListener('click', () => adminModal.classList.add('hidden'));
document.getElementById('cancelAdminModal').addEventListener('click', () => adminModal.classList.add('hidden'));

document.getElementById('saveAdminBtn').addEventListener('click', async () => {
  const btn  = document.getElementById('saveAdminBtn');
  const errEl = document.getElementById('adminFormError');
  const name  = document.getElementById('adminName').value.trim();
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  const role  = document.getElementById('adminRole').value;

  errEl.style.display = 'none';
  if (!name || !email || !pass) { errEl.textContent='All fields required'; errEl.style.display='block'; return; }

  btnLoad(btn, true);
  try {
    const user = await createAdminUser(email, pass, name, role);
    await saveAdmin(user.uid, { name, email, role });
    toast('Admin added successfully!','success');
    adminModal.classList.add('hidden');
    document.getElementById('adminForm').reset();
    await loadAdmins();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally { btnLoad(btn, false); }
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', async () => { if (confirm('Logout?')) await adminSignOut(); });
</script>
</body>
</html>
